# WeDoCode Store — backend configuration (example)
#
# Copy to application.toml, in this same folder, and adjust it: that file is local and not versioned.
#
# The backend always reads <work directory>/config/application.toml. The work directory is given when
# starting the service (--workdir=<folder> or the STORE_WORKDIR variable); in development it is fontes/work.
#
# Every key is optional: commented out, the indicated default applies. The reader accepts sections and
# key = value pairs; it does not accept lists or end-of-line comments.
#
# The log configuration sits next to it, in logback.xml.

[database]
# --- H2 (default) ----------------------------------------------------------------------------------------
# Without url, the database is a file-based H2 in the data folder: <work directory>/data/wedocode-store.
# url = "jdbc:h2:file:/path/wedocode-store;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
# username = "sa"
# password = "sa"

# --- PostgreSQL ------------------------------------------------------------------------------------------
# The database is chosen by the url. The database must exist; the tables are created on startup.
# url = "jdbc:postgresql://localhost:5432/store"
# username = "postgres"
# password = "change-me"
# Application schema (PostgreSQL only). Created if missing; without it, the user's default schema applies.
# schema = "store"

# Erases the data and reloads the demo data on every startup.
# reset = false

# Logs the executed SQL (DEBUG level).
# logSql = false

# --- Connection pool -------------------------------------------------------------------------------------
# pool.maxSize = 20
# pool.minIdle = 5
# How long to wait for a free connection before giving up.
# pool.connectionTimeoutSeconds = 30
# Maximum age of a connection; 0 turns off recycling by age.
# pool.maxLifetimeMinutes = 30

# --- Remote transactions (the ones a REST client opens at /api/tx/begin) ----------------------------------
# Idle time until the transaction is rolled back.
# remoteTransaction.idleTimeoutSeconds = 60
# Maximum lifetime, even while in use.
# remoteTransaction.maxLifetimeSeconds = 600
# How long the outcome is kept, so commit/rollback can be repeated without error.
# remoteTransaction.outcomeRetentionSeconds = 300
# Caps on open transactions: in total and per client.
# remoteTransaction.maxOpen = 128
# remoteTransaction.maxOpenPerOwner = 16
# How often abandoned transactions are looked for (rolled back once past the times above).
# remoteTransaction.reapIntervalSeconds = 15

[server]
# HTTP port.
# port = 8080

# Accepts any origin in CORS (development).
# cors.allowAll = false

[security]
# JWT secret. With it, /api/repo and /api/tx require authentication and /api/auth exists.
# Without it, the API is OPEN — development only.
# jwt.secret = "a-long-random-secret"

# Refresh token validity, in days, counted from the end of the access token it came with.
# refresh.token.ttl.days = 7

# Requests to /api/auth (challenge, login, refresh) per client address and minute; above it, 429. 0 = no limit.
# auth.requestsPerMinute = 60
