# The two backend instances behind one address (docs/running-several-instances.md):
# - a browser tab's WebSocket stays on one instance: hashed on the session id in its path;
# - an API client with a remote transaction stays on one instance: hashed on X-Client-Id;
# - /api/auth is limited per client address here, for every instance together (the backends' own limit is off).
map $uri $affinity_from_path {
    ~^/dispatcher/(?<sid>[^/]+)$  $sid;
    default                        "";
}
map $affinity_from_path $affinity {
    ""       $http_x_client_id;
    default  $affinity_from_path;
}
map $http_upgrade $connection_upgrade {
    default  upgrade;
    ""       close;
}

limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;

upstream store {
    hash $affinity consistent;
    server store-a:8080;
    server store-b:8080;
}

server {
    listen 8080;

    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://store;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://store;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
