<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasks — Cube starter</title>
    <style>
        body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1f2933; background: #f5f7fa; }
        .page { max-width: 880px; margin: 0 auto; padding: 24px 16px; }
        h1 { margin: 0 0 16px; }
        .columns { display: grid; grid-template-columns: 1fr; gap: 24px; }
        @media (min-width: 720px) { .columns { grid-template-columns: 1fr 1fr; } }
        form { display: flex; gap: 8px; margin-bottom: 12px; }
        input:not([type]) { flex: 1; padding: 6px 8px; border: 1px solid #c3cad3; border-radius: 6px; font: inherit; }
        button { padding: 6px 12px; border: 0; border-radius: 6px; background: #1f6f8b; color: white; font: inherit; cursor: pointer; }
        button + button { margin-left: 8px; }
        button.link { background: none; color: #1f6f8b; padding: 0 4px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #e4e7eb; }
        label { display: flex; gap: 8px; align-items: center; }
        .done { text-decoration: line-through; color: #7b8794; }
        .detail { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
        .detail h2 { margin-top: 0; }
        .muted { color: #7b8794; }
        .error { color: #b42318; }
    </style>
</head>
<body>
<div id="app"></div>
<script src="frontend.js"></script>
</body>
</html>
